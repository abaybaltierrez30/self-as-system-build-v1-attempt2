<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Rule Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="atmo-backdrop" class="atmo-backdrop"></canvas>

  <div id="welcome-overlay" class="welcome-overlay">
    <div class="welcome-text">WELCOME TO THE DEMO MENU!</div>
  </div>

  <main class="app-shell" role="main" aria-label="Demo Menu">
    <div class="app-window" id="app-window">
      <div class="titlebar">
        <div class="controls">
          <span class="ctrl ctrl--close"></span>
          <span class="ctrl ctrl--min"></span>
          <span class="ctrl ctrl--max"></span>
        </div>
        <div class="title">Demo Menu</div>
      </div>
      <div class="window-body">
        <div class="buttons-grid">
          <button class="app-btn">Button 1</button>
          <button class="app-btn">Button 2</button>
          <button class="app-btn">Button 3</button>
          <button class="app-btn">Button 4</button>
          <button class="app-btn">Button 5</button>
          <button class="app-btn">Button 6</button>
          <button class="app-btn">Button 7</button>
          <button class="app-btn">Button 8</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="menu.js"></script>
</body>
</html>
